<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; }
  body { background: #ffffff; font-family: 'Noto Sans SC', 'DejaVu Sans', sans-serif; }
</style>
</head>
<body>
<svg width="900" height="390" viewBox="0 0 900 390" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10" fill="none" stroke="#2d7ab3" stroke-width="1.5"/>
    </marker>
    <marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10" fill="none" stroke="#8a5a3a" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- ====== NODE KIRI: Pengguna ====== -->
  <rect x="30" y="100" width="250" height="190" rx="10" fill="#e4ecf5" stroke="#1a4a7a" stroke-width="1.8"/>
  <text x="155" y="132" text-anchor="middle" font-size="22" font-weight="700" fill="#142840">Admin / Guru</text>
  <text x="155" y="158" text-anchor="middle" font-size="15" fill="#5a7a96">satu peramban, satu akun Google</text>
  <line x1="60" y1="176" x2="250" y2="176" stroke="#c0d0e2" stroke-width="1"/>
  <text x="155" y="200" text-anchor="middle" font-size="15" fill="#5a7a96">HTML + CSS + JS: 607,5 KB</text>
  <text x="155" y="222" text-anchor="middle" font-size="15" fill="#5a7a96">semua dijalankan di sini;</text>
  <text x="155" y="244" text-anchor="middle" font-size="15" fill="#5a7a96">data contoh saat belum login</text>
  <text x="155" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#1a4a7a">86 fungsi JS, tanpa framework</text>

  <!-- ====== KOLOM KANAN ====== -->
  <!-- Netlify -->
  <rect x="520" y="15" width="350" height="82" rx="10" fill="#e4ecf5" stroke="#1a4a7a" stroke-width="1.8"/>
  <text x="540" y="44" font-size="21" font-weight="700" fill="#142840">Netlify - hosting statis</text>
  <text x="540" y="68" font-size="15" fill="#5a7a96">melayani satu berkas index.html</text>
  <text x="540" y="87" font-size="13" font-weight="700" fill="#8a5a3a">paket gratis - HUD &amp; badge ikut termuat</text>

  <!-- Google Identity -->
  <rect x="520" y="115" width="350" height="72" rx="10" fill="#edf2f9" stroke="#2d7ab3" stroke-width="1.8"/>
  <text x="540" y="143" font-size="21" font-weight="700" fill="#142840">Google Identity Services</text>
  <text x="540" y="167" font-size="15" fill="#5a7a96">login OAuth; token di localStorage</text>

  <!-- Google Drive -->
  <rect x="520" y="207" width="350" height="100" rx="10" fill="#f5ede4" stroke="#8a5a3a" stroke-width="1.8"/>
  <text x="540" y="236" font-size="21" font-weight="700" fill="#142840">Google Drive API</text>
  <text x="540" y="260" font-size="15" fill="#5a7a96">rumbela-database.json (satu berkas)</text>
  <text x="540" y="280" font-size="15" fill="#5a7a96">+ folder "Rumbela - Bank Materi"</text>
  <text x="540" y="299" font-size="13" font-weight="700" fill="#8a5a3a">tanpa kontrol konkurensi (last-write-wins)</text>

  <!-- Google Fonts -->
  <rect x="520" y="327" width="350" height="52" rx="10" fill="#edf2f9" stroke="#2d7ab3" stroke-width="1.8"/>
  <text x="540" y="348" font-size="20" font-weight="700" fill="#142840">Google Fonts</text>
  <text x="540" y="369" font-size="15" fill="#5a7a96">Plus Jakarta Sans (pemblokir render)</text>

  <!-- ====== PANAH ====== -->
  <path d="M280,130 C380,130 420,56 520,56" fill="none" stroke="#2d7ab3" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="312" y="33" width="115" height="20" fill="#ffffff" opacity="0.9"/>
  <text x="370" y="48" text-anchor="middle" font-size="15" fill="#5a7a96">HTTPS - 1 berkas</text>

  <path d="M280,175 C370,175 430,151 520,151" fill="none" stroke="#2d7ab3" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="330" y="116" width="105" height="20" fill="#ffffff" opacity="0.9"/>
  <text x="383" y="131" text-anchor="middle" font-size="15" fill="#5a7a96">login (popup)</text>

  <path d="M280,235 C380,235 420,257 520,257" fill="none" stroke="#8a5a3a" stroke-width="1.8" marker-end="url(#aw)"/>
  <rect x="316" y="268" width="150" height="20" fill="#ffffff" opacity="0.9"/>
  <text x="391" y="283" text-anchor="middle" font-size="15" fill="#8a5a3a">baca / tulis JSON utuh</text>

  <path d="M280,270 C380,270 420,353 520,353" fill="none" stroke="#2d7ab3" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="312" y="322" width="95" height="20" fill="#ffffff" opacity="0.9"/>
  <text x="360" y="337" text-anchor="middle" font-size="15" fill="#5a7a96">muat font</text>
</svg>
</body>
</html>
