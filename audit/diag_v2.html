<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; }
  body { background: #ffffff; font-family: 'Noto Sans SC', 'DejaVu Sans', sans-serif; }
</style>
</head>
<body>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10" fill="none" stroke="#2d7ab3" stroke-width="1.5"/>

  </defs>

  <!-- ====== KOLOM KIRI: Pengguna ====== -->
  <rect x="25" y="60" width="240" height="115" rx="10" fill="#e4ecf5" stroke="#1a4a7a" stroke-width="1.8"/>
  <text x="145" y="92" text-anchor="middle" font-size="22" font-weight="700" fill="#142840">Guru &amp; Admin</text>
  <text x="145" y="118" text-anchor="middle" font-size="15" fill="#5a7a96">PWA mobile-first, terpasang</text>
  <text x="145" y="138" text-anchor="middle" font-size="15" fill="#5a7a96">di layar utama, bisa offline</text>
  <text x="145" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#1a4a7a">input data harian</text>

  <rect x="25" y="300" width="240" height="115" rx="10" fill="#e4ecf5" stroke="#1a4a7a" stroke-width="1.8"/>
  <text x="145" y="332" text-anchor="middle" font-size="22" font-weight="700" fill="#142840">Orang Tua</text>
  <text x="145" y="358" text-anchor="middle" font-size="15" fill="#5a7a96">portal khusus baca:</text>
  <text x="145" y="378" text-anchor="middle" font-size="15" fill="#5a7a96">progres, tagihan, jadwal</text>
  <text x="145" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#1a4a7a">tanpa bisa mengubah data</text>

  <!-- ====== TENGAH: Aplikasi v2.0 ====== -->
  <rect x="355" y="130" width="235" height="215" rx="10" fill="#e4ecf5" stroke="#1a4a7a" stroke-width="2"/>
  <text x="472" y="162" text-anchor="middle" font-size="22" font-weight="700" fill="#142840">Aplikasi v2.0</text>
  <text x="472" y="186" text-anchor="middle" font-size="15" fill="#5a7a96">Next.js / PWA</text>
  <line x1="375" y1="200" x2="570" y2="200" stroke="#c0d0e2" stroke-width="1"/>
  <text x="472" y="224" text-anchor="middle" font-size="15" fill="#5a7a96">- multi halaman, aset terpisah</text>
  <text x="472" y="246" text-anchor="middle" font-size="15" fill="#5a7a96">- komponen UI konsisten</text>
  <text x="472" y="268" text-anchor="middle" font-size="15" fill="#5a7a96">- mode gelap + aksesibilitas</text>
  <text x="472" y="290" text-anchor="middle" font-size="15" fill="#5a7a96">- navigasi bawah 5 item</text>
  <text x="472" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#1a4a7a">hosting: Netlify / Vercel</text>

  <rect x="680" y="60" width="195" height="100" rx="10" fill="#edf2f9" stroke="#2d7ab3" stroke-width="1.8"/>

  <text x="777" y="255" text-anchor="middle" font-size="20" font-weight="700" fill="#142840">per-Baris</text>
  <text x="777" y="277" text-anchor="middle" font-size="15" fill="#5a7a96">Supabase / Firebase</text>
  <text x="777" y="297" text-anchor="middle" font-size="15" fill="#5a7a96">SQL + Auth + Storage</text>
  <text x="777" y="313" text-anchor="middle" font-size="14" font-weight="700" fill="#1a4a7a">backup harian</text>

  <rect x="680" y="365" width="195" height="85" rx="10" fill="#edf2f9" stroke="#2d7ab3" stroke-width="1.8"/>
  <text x="777" y="393" text-anchor="middle" font-size="20" font-weight="700" fill="#142840">WhatsApp API</text>
  <text x="777" y="415" text-anchor="middle" font-size="15" fill="#5a7a96">pengingat &amp; laporan</text>
  <text x="777" y="435" text-anchor="middle" font-size="15" fill="#5a7a96">terjadwal otomatis</text>

  <text x="300" y="397" text-anchor="middle" font-size="15" fill="#5a7a96">lihat</text>

  <rect x="596" y="110" width="52" height="20" fill="#ffffff" opacity="0.9"/>
  <text x="622" y="125" text-anchor="middle" font-size="15" fill="#5a7a96">aksi</text>

  <rect x="786" y="172" width="76" height="20" fill="#ffffff" opacity="0.9"/>
  <text x="824" y="187" text-anchor="middle" font-size="15" fill="#5a7a96">per baris</text>

  <rect x="786" y="332" width="60" height="20" fill="#ffffff" opacity="0.9"/>
  <text x="816" y="347" text-anchor="middle" font-size="15" fill="#5a7a96">kirim</text>
